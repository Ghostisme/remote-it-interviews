packages:
  - apps/*
  - services/*
  - packages/*

nodeLinker: hoisted
allowBuilds:
  '@embedded-postgres/windows-x64': true
  '@embedded-postgres/linux-x64': true
  '@embedded-postgres/linux-arm64': true
  '@embedded-postgres/darwin-arm64': true
  '@embedded-postgres/darwin-x64': true
  esbuild: true
  sharp: true
  workerd: true
minimumReleaseAgeExclude:
  - '@cloudflare/workerd-darwin-64@1.20261103.1'
  - '@cloudflare/workerd-darwin-arm64@1.20261103.1'
  - '@cloudflare/workerd-linux-64@1.20261103.1'
  - '@cloudflare/workerd-linux-arm64@1.20261103.1'
  - '@cloudflare/workerd-windows-64@1.20261103.1'
  - miniflare@5.20261103.0-beta
  - workerd@1.20261103.1
  - wrangler@4.157.0
